# Static export served by nginx:1.27-alpine. Replaces the image's
# /etc/nginx/conf.d/default.conf (Dockerfile and compose.truenas.yaml).
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Directory redirects (/work -> /work/) stay relative, so they keep the
    # public https host when served behind Nginx Proxy Manager / Cloudflare.
    absolute_redirect off;

    # No nginx version in the Server header or on any error page.
    server_tokens off;

    # Clean URLs: file, then directory (nginx 301s to the trailing slash and
    # serves index.html), otherwise the branded 404 page with a real 404 status.
    location / {
        try_files $uri $uri/ =404;
    }

    location /_next/static/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    error_page 404 /404.html;
    # A directory without index.html would otherwise get nginx's stock 403;
    # answer it like any other missing page.
    error_page 403 =404 /404.html;
}
