services:
  cheese-portfolio:
    build:
      context: .
      args:
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-http://localhost:8080}
        NEXT_PUBLIC_CONTACT_EMAIL: ${NEXT_PUBLIC_CONTACT_EMAIL:-info@firstrec.com.au}
    container_name: cheese-portfolio
    restart: unless-stopped
    ports:
      - "8080:80"
